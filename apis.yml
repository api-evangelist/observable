aid: observable
name: Observable
description: >-
  Observable is a data-exploration, analysis, and visualization platform that helps
  data analysts and their cross-functional stakeholders make sense of data. Its
  products include Observable Canvases (a collaborative, canvas-based data-exploration
  tool) and Observable Notebooks (reactive JavaScript notebooks for building
  interactive data visualizations with code). Observable also creates and maintains
  widely used open-source visualization tooling — D3.js, Observable Plot, Observable
  Framework, Observable Inputs, and the reactive Observable runtime — published as
  first-party npm packages. Backed by Menlo Ventures.
